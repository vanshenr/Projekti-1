<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauppalista</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Kauppalista</h1>

    <div id="form-container"> <!-- Syöttökenttä ja lisäysnappi -->
        <input type="text" id="itemInput" placeholder="Lisää tuote...">
        <button id="addBtn">Lisää listaan</button>
        <p id="errorMsg"></p>
    </div>

    <div id="filter-buttons"> <!-- Suodatusnapit -->
        <button data-filter="all">Kaikki</button>
        <button data-filter="active">Jäljellä olevat</button>
        <button data-filter="done">Kerätyt</button>
    </div>

    <ul id="shoppingList"></ul> <!-- Kauppalista -->

    <p id="counter"></p> <!-- Laskuri jäljellä oleville tuotteille -->

    <script src="javasc.js"></script>
</body>
</html>
